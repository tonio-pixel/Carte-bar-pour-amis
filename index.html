<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Meet at the Bar 🍻</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <style>
        /* FIX #1 — Hauteur garantie du conteneur carte.
           Leaflet ne dessine PAS si le conteneur a une hauteur nulle au moment de l'init.
           On force une hauteur plancher indépendante de la chaîne flex. */
        html, body { height: 100%; }
        #map {
            width: 100%;
            height: 100%;
            min-height: 320px;       /* plancher anti-écran-blanc mobile */
            background: #111827;     /* évite le flash blanc pendant le chargement */
        }

        /* Dark mode via filtre CSS sur les tuiles OSM standard */
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        .leaflet-popup-content-wrapper {
            background: #1f2937;
            color: #f3f4f6;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 280px;
        }
        .leaflet-popup-tip { background: #1f2937; }
        .leaflet-popup-content {
            margin: 14px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
            line-height: 1.5;
        }
        .leaflet-popup-content .bar-name {
            font-size: 16px; font-weight: 700; color: #ec4899;
            margin-bottom: 8px; border-bottom: 1px solid #374151; padding-bottom: 6px;
        }
        .leaflet-popup-content .bar-distance {
            margin-top: 10px; padding-top: 8px; border-top: 1px solid #374151;
            font-weight: 600; color: #f472b6; text-align: center;
        }

        .pulse-marker {
            border-radius: 50%;
            background: rgba(236, 72, 153, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 3px; }

        .spinner {
            border: 3px solid rgba(236, 72, 153, 0.2);
            border-top: 3px solid #ec4899;
            border-radius: 50%;
            width: 20px; height: 20px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .leaflet-popup-content a:hover { color: #93c5fd !important; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- LEFT PANEL -->
    <aside class="w-full md:w-[420px] lg:w-[480px] bg-gray-800 border-r border-gray-700 flex flex-col h-[50vh] md:h-screen min-h-0 overflow-hidden z-20 relative">

        <header class="p-5 border-b border-gray-700 bg-gray-800/95 backdrop-blur-sm">
            <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                <span class="text-3xl">🍻</span> Meet at the Bar
            </h1>
            <p class="text-gray-400 text-sm mt-1">
                Trouvez le bar parfait au point d'équidistance de votre groupe.
            </p>
        </header>

        <div class="flex-1 overflow-y-auto p-5 custom-scroll">
            <div id="participants-container" class="space-y-4"></div>

            <button id="btn-add-participant"
                    class="mt-4 w-full py-2 px-4 border-2 border-dashed border-gray-600 rounded-xl text-gray-400 hover:border-pink-500 hover:text-pink-400 transition-all duration-200 text-sm font-medium flex items-center justify-center gap-2">
                <span class="text-lg">+</span> Ajouter un participant
            </button>

            <div class="mt-6 space-y-3">
                <button id="btn-find"
                        class="w-full py-3 px-4 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl transition-all duration-200 shadow-lg shadow-pink-600/20 hover:shadow-pink-500/30 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="btn-find-text">🎯 Calculer le point de RDV</span>
                    <div id="btn-find-spinner" class="spinner hidden"></div>
                </button>

                <button id="btn-reset"
                        class="w-full py-2 px-4 bg-gray-700 hover:bg-gray-600 text-gray-300 font-medium rounded-xl transition-all duration-200 text-sm">
                    ↺ Réinitialiser
                </button>
            </div>

            <div id="status-area" class="mt-4 space-y-2"></div>

            <div id="results-summary" class="mt-5 hidden pb-6">
                <div class="bg-gray-700/50 rounded-xl p-4 border border-gray-600 shadow-inner">
                    <h3 class="text-sm font-bold text-pink-400 uppercase tracking-wide mb-3 flex items-center gap-2">
                        <span>🎯</span> Point de RDV calculé
                    </h3>
                    <div id="center-info" class="text-sm text-gray-300 space-y-2"></div>
                </div>

                <div class="mt-6">
                    <h3 class="text-sm font-bold text-pink-400 uppercase tracking-wide mb-3 flex items-center gap-2">
                        <span>🏆</span> Le Top 3
                    </h3>
                    <div id="bars-list" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <footer class="p-3 border-t border-gray-700 text-center">
            <p class="text-xs text-gray-500">
                Données © <a href="https://www.openstreetmap.org/copyright" class="text-pink-500 hover:underline">OpenStreetMap</a> contributors
            </p>
        </footer>
    </aside>

    <!-- MAP AREA -->
    <main class="flex-1 relative h-[50vh] md:h-screen min-h-0 bg-gray-800">
        <div id="map"></div>

        <div id="map-overlay" class="absolute top-4 right-4 z-[1000] bg-gray-800/90 backdrop-blur-sm rounded-xl px-4 py-2 text-xs text-gray-300 border border-gray-600 hidden shadow-lg transition-opacity duration-300">
            <span class="text-pink-400 font-bold">🎯</span> Point d'équidistance trouvé
        </div>
    </main>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const TRANSPORT_WEIGHTS = { 'walking': 4.0, 'transit': 2.0, 'cycling': 1.5, 'driving': 1.0 };
        const TRANSPORT_LABELS = {
            'walking': { label: 'À pied', icon: '🚶', weight: 4.0 },
            'transit': { label: 'Métro/Bus', icon: '🚇', weight: 2.0 },
            'cycling': { label: 'Vélo', icon: '🚲', weight: 1.5 },
            'driving': { label: 'Voiture', icon: '🚗', weight: 1.0 }
        };

        const BAR_SEARCH_RADIUS = 5000;
        const MAX_BARS = 3;
        const NOMINATIM_DELAY = 1100;        // > 1s, conforme CGU Nominatim
        const MAX_PARTICIPANTS = 5;
        const CONTACT_EMAIL = 'tonio-pixel@users.noreply.github.com'; // identifie le projet (CGU Nominatim)

        // ============================================================
        // STATE
        // ============================================================
        let participants = [];
        let map = null;
        let markers = [];
        let searchCircle = null;

        // ============================================================
        // UTILS
        // ============================================================
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        // FIX #2 — Helper robuste : force Leaflet à recalculer sa taille
        // après toute opération qui change le layout ou la vue.
        function refreshMapSize(delay = 0) {
            if (!map) return;
            setTimeout(() => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => map.invalidateSize());
                });
            }, delay);
        }

        function clearMap() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            if (searchCircle) { map.removeLayer(searchCircle); searchCircle = null; }
        }

        function hideStatus() { document.getElementById('status-area').innerHTML = ''; }

        function setLoading(isLoading) {
            const btn = document.getElementById('btn-find');
            const text = document.getElementById('btn-find-text');
            const spinner = document.getElementById('btn-find-spinner');
            btn.disabled = isLoading;
            text.classList.toggle('hidden', isLoading);
            spinner.classList.toggle('hidden', !isLoading);
        }

        function formatBarType(type) {
            const map = { 'bar': '🍸 Bar', 'pub': '🍺 Pub', 'biergarten': '🌳 Biergarten', 'cafe': '☕ Café' };
            return map[type] || `📍 ${type}`;
        }

        // FIX #4 — Affichage propre : happy_hours (booléen) vs opening_hours séparés
        function generateBarDetailsHTML(bar) {
            const getVal = (val) => val
                ? `<span class="font-bold text-gray-100">${val}</span>`
                : `<span class="italic text-gray-500 text-xs">Non renseigné</span>`;

            const hhBadge = bar.happy_hours
                ? `<span class="bg-green-500/20 text-green-400 px-2 py-0.5 rounded text-[10px] font-bold uppercase border border-green-500/30">Oui</span>`
                : `<span class="bg-gray-600/30 text-gray-400 px-2 py-0.5 rounded text-[10px] font-bold uppercase border border-gray-600/50">Non renseigné</span>`;

            return `
                <div class="space-y-1.5 text-xs text-gray-300 mt-2">
                    <div class="flex items-start gap-2"><span class="w-4 text-center">📂</span><span class="w-24 text-gray-400">Type :</span><span class="flex-1">${getVal(formatBarType(bar.type))}</span></div>
                    <div class="flex items-start gap-2"><span class="w-4 text-center">💰</span><span class="w-24 text-gray-400">Prix :</span><span class="flex-1">${getVal(bar.price)}</span></div>
                    <div class="flex items-start gap-2"><span class="w-4 text-center">🍹</span><span class="w-24 text-gray-400">Happy Hour :</span><span class="flex-1">${hhBadge}</span></div>
                    <div class="flex items-start gap-2"><span class="w-4 text-center">⏱️</span><span class="w-24 text-gray-400">Horaires HH :</span><span class="flex-1">${getVal(bar.happy_hours)}</span></div>
                    <div class="flex items-start gap-2"><span class="w-4 text-center">🕐</span><span class="w-24 text-gray-400">Ouverture :</span><span class="flex-1">${getVal(bar.opening_hours)}</span></div>
                </div>`;
        }

        function generateGoogleMapsBtn(lat, lng, label = "📍 Ouvrir dans Google Maps") {
            const url = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
            return `<a href="${url}" target="_blank" rel="noopener"
                   class="mt-3 flex items-center justify-center gap-2 w-full py-2 px-3 bg-blue-600/20 hover:bg-blue-600/40 border border-blue-500/50 text-blue-400 hover:text-blue-300 font-bold rounded-lg transition-colors text-xs shadow-sm">${label}</a>`;
        }

        // ============================================================
        // INIT MAP (FIX #1 + #2)
        // ============================================================
        function initMap() {
            map = L.map('map', { zoomControl: true, attributionControl: false })
                   .setView([48.8566, 2.3522], 12);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                crossOrigin: true,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // ResizeObserver : gère les changements de taille du conteneur
            // (rotation mobile, barre d'URL dynamique, passage mobile/desktop)
            const container = document.getElementById('map');
            if ('ResizeObserver' in window) {
                new ResizeObserver(() => map.invalidateSize()).observe(container);
            }
            window.addEventListener('resize', () => map.invalidateSize());
            window.addEventListener('orientationchange', () => refreshMapSize(250));

            // Double invalidate au démarrage (layout mobile instable)
            refreshMapSize(0);
            refreshMapSize(350);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            createParticipantRow(0);
            createParticipantRow(1);

            document.getElementById('btn-add-participant').addEventListener('click', () => {
                if (getParticipantRowCount() < MAX_PARTICIPANTS) createParticipantRow(getParticipantRowCount());
                else updateStatus(`Maximum de ${MAX_PARTICIPANTS} participants atteint.`, 'warning');
            });
            document.getElementById('btn-find').addEventListener('click', findMeetingPoint);
            document.getElementById('btn-reset').addEventListener('click', () => {
                document.getElementById('participants-container').innerHTML = '';
                createParticipantRow(0); createParticipantRow(1);
                clearMap(); hideStatus();
                document.getElementById('results-summary').classList.add('hidden');
                document.getElementById('map-overlay').classList.add('hidden');
                map.setView([48.8566, 2.3522], 12);
                refreshMapSize(0);
            });
        });

        // ============================================================
        // PARTICIPANTS UI
        // ============================================================
        function createParticipantRow(index) {
            const row = document.createElement('div');
            row.className = 'bg-gray-700/40 rounded-xl p-4 border border-gray-600/50 hover:border-gray-500/50 transition-colors';
            row.id = `participant-row-${index}`;
            row.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <span class="text-sm font-bold text-gray-300 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-pink-600/20 text-pink-400 flex items-center justify-center text-xs font-bold">${index + 1}</span>
                        Personne ${index + 1}
                    </span>
                    ${index >= 2 ? `<button onclick="removeParticipant(${index})" class="text-gray-500 hover:text-red-400 text-lg transition-colors" title="Supprimer">✕</button>` : ''}
                </div>
                <div class="space-y-2">
                    <input type="text" id="address-${index}" placeholder="Ex: 10 rue de la République, Lyon" autocomplete="off"
                           class="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500/30 transition-all">
                    <select id="transport-${index}" class="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-pink-500 transition-all">
                        <option value="walking">🚶 À pied (poids: 4.0)</option>
                        <option value="transit">🚇 Métro/Bus (poids: 2.0)</option>
                        <option value="cycling">🚲 Vélo (poids: 1.5)</option>
                        <option value="driving">🚗 Voiture (poids: 1.0)</option>
                    </select>
                </div>`;
            document.getElementById('participants-container').appendChild(row);
        }

        function removeParticipant(index) {
            const row = document.getElementById(`participant-row-${index}`);
            if (row) { row.remove(); reindexParticipants(); }
        }

        function reindexParticipants() {
            document.querySelectorAll('[id^="participant-row-"]').forEach((row, i) => {
                row.id = `participant-row-${i}`;
                const titleSpan = row.querySelector('span.font-bold.text-gray-300');
                if (titleSpan) titleSpan.innerHTML = `<span class="w-6 h-6 rounded-full bg-pink-600/20 text-pink-400 flex items-center justify-center text-xs font-bold">${i + 1}</span> Personne ${i + 1}`;
                const input = row.querySelector('input[type="text"]');
                const select = row.querySelector('select');
                if (input) input.id = `address-${i}`;
                if (select) select.id = `transport-${i}`;
                const removeBtn = row.querySelector('button[onclick]');
                if (removeBtn && i >= 2) removeBtn.setAttribute('onclick', `removeParticipant(${i})`);
            });
        }

        function getParticipantRowCount() { return document.querySelectorAll('[id^="participant-row-"]').length; }

        // ============================================================
        // GEOCODING (NOMINATIM) — FIX User-Agent + email CGU
        // ============================================================
        async function geocodeAddress(address) {
            const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&email=${encodeURIComponent(CONTACT_EMAIL)}&q=${encodeURIComponent(address)}`;
            try {
                const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), displayName: data[0].display_name };
                }
                return null;
            } catch (error) {
                console.error(`Geocoding error for "${address}":`, error);
                return null;
            }
        }

        async function geocodeAllParticipants() {
            const count = getParticipantRowCount();
            const results = [];
            for (let i = 0; i < count; i++) {
                const addressInput = document.getElementById(`address-${i}`);
                const transportSelect = document.getElementById(`transport-${i}`);
                if (!addressInput || !transportSelect) continue;
                const address = addressInput.value.trim();
                if (!address) continue;

                updateStatus(`🔍 Géocodage de "${address}"...`, 'info');
                const geoResult = await geocodeAddress(address);
                if (geoResult) {
                    results.push({ address, transport: transportSelect.value, lat: geoResult.lat, lng: geoResult.lng, name: `Personne ${i + 1}` });
                    updateStatus(`✅ ${address} géocodée`, 'success');
                } else {
                    updateStatus(`❌ Adresse introuvable: "${address}"`, 'error');
                }
                if (i < count - 1) await sleep(NOMINATIM_DELAY);
            }
            return results;
        }

// ============================================================
// BARYCENTER — version corrigée (projection sphérique + ancrage)
// ============================================================

// Convertit lat/lng en vecteur unitaire 3D (précis sur tout le globe)
function toVector(lat, lng) {
    const φ = lat * Math.PI / 180, λ = lng * Math.PI / 180;
    return {
        x: Math.cos(φ) * Math.cos(λ),
        y: Math.cos(φ) * Math.sin(λ),
        z: Math.sin(φ)
    };
}

// Repasse d'un vecteur 3D vers lat/lng
function toLatLng(v) {
    const lat = Math.atan2(v.z, Math.hypot(v.x, v.y)) * 180 / Math.PI;
    const lng = Math.atan2(v.y, v.x) * 180 / Math.PI;
    return { lat, lng };
}

// Barycentre pondéré sur la sphère (corrige la distortion lat/lng)
function computeWeightedCenter(points) {
    const valid = points
        .map(p => ({ ...toVector(p.lat, p.lng), weight: TRANSPORT_WEIGHTS[p.transport] || 1.0 }))
        .filter(p => isFinite(p.weight) && p.weight > 0);
    if (!valid.length) return null;

    const total = valid.reduce((s, p) => s + p.weight, 0);
    if (total === 0) return null;

    const cx = valid.reduce((s, p) => s + p.x * p.weight, 0) / total;
    const cy = valid.reduce((s, p) => s + p.y * p.weight, 0) / total;
    const cz = valid.reduce((s, p) => s + p.z * p.weight, 0) / total;

    // Garde-fou : si les points sont quasi opposés (ex. deux hémisphères),
    // le centre tombe au cœur de la Terre → on retombe sur la médiane simple.
    if (Math.hypot(cx, cy, cz) < 1e-6) {
        const lats = points.map(p => p.lat).sort((a, b) => a - b);
        const lngs = points.map(p => p.lng).sort((a, b) => a - b);
        const mid = (arr) => arr.length % 2 ? arr[(arr.length - 1) / 2]
            : (arr[arr.length / 2 - 1] + arr[arr.length / 2]) / 2;
        return { lat: mid(lats), lng: mid(lngs) };
    }
    return toLatLng({ x: cx, y: cy, z: cz });
}

// Ramène le point sur la route/zone habitée la plus proche (évite le point en mer/campagne)
async function snapToNearestPlace(lat, lng) {
    try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=16&addressdetails=0&email=${encodeURIComponent(CONTACT_EMAIL)}`;
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) return { lat, lng };
        const data = await res.json();
        if (data && data.lat && data.lon) {
            return { lat: parseFloat(data.lat), lng: parseFloat(data.lon), displayName: data.display_name };
        }
    } catch (e) {
        console.warn('Snap failed, on garde le point brut :', e);
    }
    return { lat, lng };
}

// Point d'équidistance final = centre sphérique + ancrage sur du réel
async function calculateBarycenter(points) {
    const raw = computeWeightedCenter(points);
    if (!raw) return null;
    return await snapToNearestPlace(raw.lat, raw.lng);
}

        // ============================================================
        // BAR SEARCH (OVERPASS)
        // ============================================================
        async function searchBars(lat, lng, radius) {
            const q = `[out:json][timeout:25];(node["amenity"~"bar|pub|biergarten|cafe"](around:${radius},${lat},${lng});way["amenity"~"bar|pub|biergarten|cafe"](around:${radius},${lat},${lng});relation["amenity"~"bar|pub|biergarten|cafe"](around:${radius},${lat},${lng}););out center body 50;`;
            const endpoints = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
            for (let i = 0; i < endpoints.length; i++) {
                try {
                    updateStatus('🔍 Recherche de bars...', 'info');
                    const response = await fetch(endpoints[i], {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `data=${encodeURIComponent(q)}`
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    if (data.elements && data.elements.length > 0) return parseOverpassResults(data.elements);
                } catch (error) {
                    console.warn('Overpass endpoint failed:', error);
                    if (i < endpoints.length - 1) await sleep(1000);
                }
            }
            return [];
        }

        function parseOverpassResults(elements) {
            return elements.map(el => {
                const lat = el.lat ?? (el.center ? el.center.lat : null);
                const lng = el.lon ?? (el.center ? el.center.lon : null);
                if (lat === null || lng === null) return null;
                const t = el.tags || {};
                return {
                    id: el.id, lat, lng,
                    name: t.name || 'Nom inconnu',
                    type: t.amenity || 'bar',
                    opening_hours: t.opening_hours || null,
                    happy_hours: t.happy_hours || null,
                    price: t.charge || t.price || t.fee || null
                };
            }).filter(Boolean);
        }

        // ============================================================
        // DISTANCE
        // ============================================================
        function haversineDistance(lat1, lng1, lat2, lng2) {
            const R = 6371000, toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

       // ============================================================
       // MAIN LOGIC
       // ============================================================
async function findMeetingPoint() {
    clearMap(); hideStatus();
    document.getElementById('results-summary').classList.add('hidden');
    document.getElementById('map-overlay').classList.add('hidden');
    setLoading(true);
    try {
        updateStatus('📍 Géocodage des adresses en cours...', 'info');
        participants = await geocodeAllParticipants();
        const valid = participants.filter(p => p.lat != null && p.lng != null);
        if (valid.length < 2) { updateStatus('⚠️ Au moins 2 adresses valides sont requises.', 'error'); return; }

        updateStatus('⚖️ Calcul du point d\'équidistance pondéré...', 'info');
        const center = await calculateBarycenter(valid);
        if (!center) { updateStatus('❌ Impossible de calculer le centre.', 'error'); return; }

        addCenterMarker(center.lat, center.lng);
        addParticipantMarkers(valid, center);
        map.setView([center.lat, center.lng], 14, { animate: true });
        document.getElementById('map-overlay').classList.remove('hidden');

        updateStatus('🍺 Recherche des bars à proximité (Rayon 5km)...', 'info');
        const bars = await searchBars(center.lat, center.lng, BAR_SEARCH_RADIUS);
        if (bars.length === 0) {
            updateStatus('⚠️ Aucun bar trouvé. Élargissez la zone ou changez d\'adresses.', 'warning');
            displayResultsSummary(center, [], valid);
            return;
        }

        const ranked = bars.map(b => ({ ...b, distance: haversineDistance(center.lat, center.lng, b.lat, b.lng) }))
                           .sort((a, b) => a.distance - b.distance).slice(0, MAX_BARS);
        addBarMarkers(ranked);
        displayResultsSummary(center, ranked, valid);
        updateStatus(`🎉 ${ranked.length} bar(s) idéal(aux) trouvé(s) !`, 'success');

        const allLats = valid.map(p => p.lat).concat(ranked.map(b => b.lat));
        const allLngs = valid.map(p => p.lng).concat(ranked.map(b => b.lng));
        map.fitBounds([[Math.min(...allLats), Math.min(...allLngs)], [Math.max(...allLats), Math.max(...allLngs)]], { padding: [50, 50] });
        refreshMapSize(400);
    } catch (error) {
        console.error('Fatal error:', error);
        updateStatus(`❌ Erreur: ${error.message}`, 'error');
    } finally {
        setLoading(false);
    }
}

        // ============================================================
        // MARKERS
        // ============================================================
        function addCenterMarker(lat, lng) {
            const icon = L.divIcon({
                className: 'pulse-marker',
                html: '<div style="width:20px;height:20px;background:#ec4899;border-radius:50%;border:3px solid white;box-shadow:0 0 15px rgba(236,72,153,0.6);"></div>',
                iconSize: [20, 20], iconAnchor: [10, 10]
            });
            const popup = `<div class="bar-name text-center mb-2">🎯 Point de RDV Calculé</div>
                <div class="text-gray-300 text-xs mb-1"><strong>Lat:</strong> ${lat.toFixed(6)}</div>
                <div class="text-gray-300 text-xs mb-3"><strong>Lng:</strong> ${lng.toFixed(6)}</div>
                ${generateGoogleMapsBtn(lat, lng, "📍 Ouvrir ce point dans Google Maps")}`;
            markers.push(L.marker([lat, lng], { icon }).addTo(map).bindPopup(popup));
            searchCircle = L.circle([lat, lng], { radius: BAR_SEARCH_RADIUS, color: '#ec4899', fillColor: '#ec4899', fillOpacity: 0.03, weight: 1, dashArray: '5, 10' }).addTo(map);
        }

        function addParticipantMarkers(points, center) {   // FIX #3
            points.forEach(p => {
                const info = TRANSPORT_LABELS[p.transport] || { icon: '📍', label: '?' };
                const weight = TRANSPORT_WEIGHTS[p.transport] || 1.0;
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="background:#374151;border:2px solid #6b7280;border-radius:8px;padding:2px 6px;font-size:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.3);">${info.icon}</div>`,
                    iconSize: [30, 24], iconAnchor: [15, 12]
                });
                markers.push(L.marker([p.lat, p.lng], { icon }).addTo(map).bindPopup(`
                    <div class="bar-name">${p.name}</div>
                    <div class="text-xs text-gray-300 mb-1"><strong>Adresse:</strong> ${p.address}</div>
                    <div class="text-xs text-gray-300 mb-1"><strong>Transport:</strong> ${info.icon} ${info.label}</div>
                    <div class="text-xs text-gray-300"><strong>Pondération:</strong> ${weight.toFixed(1)}</div>`));
                markers.push(L.polyline([[p.lat, p.lng], [center.lat, center.lng]], { color: '#9ca3af', weight: 1.5, opacity: 0.4, dashArray: '5, 10' }).addTo(map));
            });
        }

        function addBarMarkers(bars) {
            const icons = ['🥇', '🥈', '🥉'];
            bars.forEach((bar, index) => {
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="background:#1f2937;border:2px solid #ec4899;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 12px rgba(236,72,153,0.4);">${icons[index] || '🍺'}</div>`,
                    iconSize: [36, 36], iconAnchor: [18, 18]
                });
                const popup = `<div class="bar-name">${icons[index] || '🍺'} ${bar.name}</div>
                    ${generateBarDetailsHTML(bar)}
                    <div class="bar-distance">📏 Distance du RDV: ${(bar.distance / 1000).toFixed(2)} km</div>
                    ${generateGoogleMapsBtn(bar.lat, bar.lng, "📍 Voir sur Google Maps")}`;
                markers.push(L.marker([bar.lat, bar.lng], { icon }).addTo(map).bindPopup(popup));
            });
        }

        // ============================================================
        // DISPLAY
        // ============================================================
        function displayResultsSummary(center, bars, participants) {
            document.getElementById('results-summary').classList.remove('hidden');
            document.getElementById('center-info').innerHTML = `
                <div class="grid grid-cols-2 gap-2 text-xs mb-2">
                    <div class="bg-gray-800 rounded p-2 border border-gray-600"><strong>Lat:</strong> <span class="text-pink-400">${center.lat.toFixed(5)}</span></div>
                    <div class="bg-gray-800 rounded p-2 border border-gray-600"><strong>Lng:</strong> <span class="text-pink-400">${center.lng.toFixed(5)}</span></div>
                </div>
                <div class="text-[11px] text-gray-400 mt-2 bg-gray-800/50 p-2 rounded">
                    <strong>Pondérations appliquées :</strong><br/>
                    ${participants.map(p => `${(TRANSPORT_LABELS[p.transport]||{}).icon||''} ${p.name} (${TRANSPORT_WEIGHTS[p.transport]||1})`).join(' • ')}
                </div>
                ${generateGoogleMapsBtn(center.lat, center.lng, "📍 Ouvrir le point de RDV dans Google Maps")}`;

            const icons = ['🥇', '🥈', '🥉'];
            document.getElementById('bars-list').innerHTML = bars.length
                ? bars.map((bar, i) => `
                    <div class="bg-gray-700/40 rounded-xl p-4 border border-gray-600/60 hover:border-pink-500/50 transition-colors shadow-sm">
                        <div class="flex items-center justify-between border-b border-gray-600/50 pb-2 mb-2">
                            <h4 class="text-base font-bold text-gray-100 truncate pr-2 flex items-center gap-2"><span class="text-xl">${icons[i] || '🍺'}</span> ${bar.name}</h4>
                            <span class="text-xs font-bold text-pink-400 bg-pink-500/10 px-2 py-1 rounded-lg whitespace-nowrap">${(bar.distance/1000).toFixed(2)} km</span>
                        </div>
                        ${generateBarDetailsHTML(bar)}
                        <div class="mt-4">${generateGoogleMapsBtn(bar.lat, bar.lng, "📍 Voir ce bar dans Google Maps")}</div>
                    </div>`).join('')
                : `<div class="text-sm text-gray-400 italic text-center p-4">Aucun établissement trouvé à proximité.</div>`;
        }

        function updateStatus(message, type) {
            const colors = {
                'info': 'text-blue-400 border-blue-500/30 bg-blue-500/10',
                'success': 'text-green-400 border-green-500/30 bg-green-500/10',
                'error': 'text-red-400 border-red-500/30 bg-red-500/10',
                'warning': 'text-yellow-400 border-yellow-500/30 bg-yellow-500/10'
            };
            const div = document.createElement('div');
            div.className = `text-xs px-3 py-2 rounded-lg border ${colors[type]} transition-opacity duration-500 font-medium`;
            div.textContent = message;
            document.getElementById('status-area').appendChild(div);
            setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 500); }, 5000);
        }
    </script>
</body>
