<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point de Rendez-vous Bars</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 100%; min-height: 400px; z-index: 10; }
        .leaflet-popup-content-wrapper { background-color: #1f2937; color: #f3f4f6; border-radius: 0.5rem; }
        .leaflet-popup-tip { background-color: #1f2937; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col md:flex-row h-screen font-sans">

    <div class="w-full md:w-1/3 p-4 bg-gray-800 shadow-xl overflow-y-auto flex flex-col gap-4 z-20">
        <h1 class="text-2xl font-bold text-pink-500 mb-1">📍 Meet at the Bar</h1>
        <p class="text-xs text-gray-400 mb-2">Le point central s'adaptera au moyen de transport de chacun.</p>
        
        <div id="address-inputs" class="flex flex-col gap-3">
            <div class="flex gap-2 participant-row">
                <input type="text" placeholder="Adresse 1" class="address-input w-2/3 p-2 bg-gray-700 text-sm rounded-lg border border-gray-600 focus:outline-none focus:border-pink-500" value="Gare de Lyon, Paris">
                <select class="mode-select w-1/3 p-2 bg-gray-700 text-sm rounded-lg border border-gray-600 focus:outline-none focus:border-pink-500">
                    <option value="transit">🚇 Métro</option>
                    <option value="walk">🚶 À pied</option>
                    <option value="bike">🚲 Vélo</option>
                    <option value="car">🚗 Voiture</option>
                </select>
            </div>
            <div class="flex gap-2 participant-row">
                <input type="text" placeholder="Adresse 2" class="address-input w-2/3 p-2 bg-gray-700 text-sm rounded-lg border border-gray-600 focus:outline-none focus:border-pink-500" value="Châtelet, Paris">
                <select class="mode-select w-1/3 p-2 bg-gray-700 text-sm rounded-lg border border-gray-600 focus:outline-none focus:border-pink-500">
                    <option value="transit">🚇 Métro</option>
                    <option value="walk">🚶 À pied</option>
                    <option value="bike">🚲 Vélo</option>
                    <option value="car">🚗 Voiture</option>
                </select>
            </div>
            <div class="flex gap-2 participant-row">
                <input type="text" placeholder="Adresse 3" class="address-input w-2/3 p-2 bg-gray-700 text-sm rounded-lg border border-gray-600 focus:outline-none focus:border-pink-500">
                <select class="mode-select w-1/3 p-2 bg-gray-700 text-sm rounded-lg border border-gray-600 focus:outline-none focus:border-pink-500">
                    <option value="transit">🚇 Métro</option>
                    <option value="walk">🚶 À pied</option>
                    <option value="bike">🚲 Vélo</option>
                    <option value="car">🚗 Voiture</option>
                </select>
            </div>
            <div class="flex gap-2 participant-row">
                <input type="text" placeholder="Adresse 4" class="address-input w-2/3 p-2 bg-gray-700 text-sm rounded-lg border border-gray-600 focus:outline-none focus:border-pink-500">
                <select class="mode-select w-1/3 p-2 bg-gray-700 text-sm rounded-lg border border-gray-600 focus:outline-none focus:border-pink-500">
                    <option value="transit">🚇 Métro</option>
                    <option value="walk">🚶 À pied</option>
                    <option value="bike">🚲 Vélo</option>
                    <option value="car">🚗 Voiture</option>
                </select>
            </div>
            <div class="flex gap-2 participant-row">
                <input type="text" placeholder="Adresse 5" class="address-input w-2/3 p-2 bg-gray-700 text-sm rounded-lg border border-gray-600 focus:outline-none focus:border-pink-500">
                <select class="mode-select w-1/3 p-2 bg-gray-700 text-sm rounded-lg border border-gray-600 focus:outline-none focus:border-pink-500">
                    <option value="transit">🚇 Métro</option>
                    <option value="walk">🚶 À pied</option>
                    <option value="bike">🚲 Vélo</option>
                    <option value="car">🚗 Voiture</option>
                </select>
            </div>
        </div>

        <button id="calculate-btn" class="mt-4 bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
            Calculer l'itinéraire idéal
        </button>
        <div id="status" class="text-sm text-pink-400 mt-2 hidden">Analyse des trajets...</div>
    </div>

    <div class="w-full md:w-2/3 h-full relative">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([48.8566, 2.3522], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        let userMarkers = L.layerGroup().addTo(map);
        let barMarkers = L.layerGroup().addTo(map);

        const userIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34]
        });
        const barIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-gold.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34]
        });

        /**
         * @param {string} address 
         */
        async function geocode(address) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`;
            const response = await fetch(url);
            const data = await response.json();
            if (data && data.length > 0) {
                return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
            }
            return null;
        }

        /**
         * @param {number} lat 
         * @param {number} lon 
         */
        async function fetchRealBars(lat, lon) {
            const query = `[out:json];node(around:500,${lat},${lon})["amenity"~"bar|pub"];out;`;
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                return data.elements;
            } catch (error) {
                console.error("Erreur Overpass:", error);
                return [];
            }
        }

        document.getElementById('calculate-btn').addEventListener('click', async () => {
            const rows = document.querySelectorAll('.participant-row');
            const status = document.getElementById('status');
            if (status) {
                status.classList.remove('hidden');
                status.innerText = "Géocodage des adresses...";
            }
            
            userMarkers.clearLayers();
            barMarkers.clearLayers();
            
            let coords = [];
            
            const transportWeights = {
                'walk': 4.0,
                'transit': 2.0,
                'bike': 1.5,
                'car': 1.0
            };
            
            for (let row of rows) {
                const input = row.querySelector('.address-input');
                const select = row.querySelector('.mode-select');
                
                if (input && select && input.value.trim() !== "") {
                    let coord = await geocode(input.value);
                    if (coord) {
                        const transportName = select.options[select.selectedIndex].text;
                        coords.push({
                            lat: coord.lat,
                            lon: coord.lon,
                            weight: transportWeights[select.value],
                            label: input.value,
                            transport: transportName
                        });
                        
                        L.marker([coord.lat, coord.lon], {icon: userIcon})
                            .bindPopup(`<b>Départ :</b> ${input.value}<br><b>Mode :</b> ${transportName}`)
                            .addTo(userMarkers);
                    }
                }
                await new Promise(r => setTimeout(r, 500));
            }

            if (coords.length > 0) {
                let totalWeight = 0;
                let weightedLat = 0;
                let weightedLon = 0;

                coords.forEach(c => {
                    weightedLat += c.lat * c.weight;
                    weightedLon += c.lon * c.weight;
                    totalWeight += c.weight;
                });

                let centerLat = weightedLat / totalWeight;
                let centerLon = weightedLon / totalWeight;
                
                map.setView([centerLat, centerLon], 15);
                
                L.circle([centerLat, centerLon], {
                    color: '#ec4899',
                    fillColor: '#ec4899',
                    fillOpacity: 0.1,
                    radius: 500
                }).addTo(barMarkers);
                
                if (status) status.innerText = "Recherche des établissements à moins de 500m...";
                const realBars = await fetchRealBars(centerLat, centerLon);

                if (realBars.length === 0) {
                    alert("Aucun bar répertorié dans un rayon de 500m autour du point de convergence.");
                } else {
                    /**
                     * @param {any} bar 
                     */
                    const addBarToMap = (bar) => {
                        const tags = bar.tags;
                        if (!tags || !tags.name) return;

                        const nom = tags.name;
                        const horaires = tags.opening_hours ? tags.opening_hours.replace(/;/g, '<br>') : "<span class='text-gray-400 italic'>Non renseigné</span>";
                        const happyHour = tags.happy_hours || "<span class='text-gray-400 italic'>Inconnu</span>";
                        const prix = tags.charge || tags.price || "<span class='text-gray-400 italic'>Inconnu</span>";
                        const type = tags.amenity === 'pub' ? 'Pub' : 'Bar';

                        let popupContent = `
                            <div class="text-sm min-w-[220px]">
                                <h3 class="font-bold text-pink-400 text-base border-b border-gray-600 pb-1 mb-2">${nom}</h3>
                                <p class="mb-1 text-xs text-gray-300 uppercase">${type}</p>
                                <p class="mb-2 mt-2"><b>🕒 Horaires :</b><br> ${horaires}</p>
                                <p class="mb-1"><b>🍻 Happy Hour :</b> ${happyHour}</p>
                                <p class="mb-1"><b>💶 Prix indicatif :</b> ${prix}</p>
                            </div>
                        `;
                        L.marker([bar.lat, bar.lon], {icon: barIcon}).bindPopup(popupContent).addTo(barMarkers);
                    };

                    realBars.forEach(addBarToMap);
                }
            }
            if (status) status.classList.add('hidden');
        });
    </script>
</body>
</html>
